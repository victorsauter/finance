server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Logs are collected by Kubernetes rather than written to the container.
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  # Security headers suitable for a static single-page application.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

  # Do not cache the HTML shell or PWA worker: a fresh visit must be able to
  # discover an application update. Hashed Vite assets can be cached for a long
  # time because every new build gives them a new filename.
  location = /index.html {
    expires -1;
    try_files /index.html =404;
  }

  location ~* ^/(?:sw|registerSW|workbox-[^/]+)\.js$ {
    expires -1;
    try_files $uri =404;
  }

  location ~* \.(?:css|js|mjs|png|svg|ico|webp|woff2?)$ {
    expires 1y;
    try_files $uri =404;
  }

  # React Router owns routes such as /operations and /sauvegarde.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
