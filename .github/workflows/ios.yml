name: Validate iOS

on:
  pull_request:
    paths: ['ios/**', 'fixtures/**', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['ios/**', 'fixtures/**', '.github/workflows/ios.yml']

permissions:
  contents: read

jobs:
  validate:
    # macos-26 is the Apple silicon image whose default Xcode is 26.x.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test FinanceKit
        working-directory: ios/FinanceKit
        run: swift test
      # supabase-swift is a remote package: fetch exactly the versions pinned in
      # Package.resolved, and fail if the project asks for anything else.
      - name: Resolve Swift packages
        working-directory: ios
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Finance.xcodeproj \
            -onlyUsePackageVersionsFromResolvedFile \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm"
      - name: Build the app for the simulator
        working-directory: ios
        run: |
          xcodebuild \
            -project Finance.xcodeproj \
            -scheme Finance \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived-data" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            build
