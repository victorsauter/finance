apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finance
  labels:
    app.kubernetes.io/name: finance
  annotations:
    # Requires cert-manager and a ClusterIssuer named letsencrypt-production.
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - finance.victorsauter.com
      secretName: finance-tls
  rules:
    - host: finance.victorsauter.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: finance
                port:
                  name: http
