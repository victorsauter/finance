# Apply this only after replacing the email address and after cert-manager is
# installed. It is deliberately outside the production kustomization so an
# unfinished value can never be deployed by accident.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    email: REPLACE_WITH_YOUR_EMAIL@example.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-production-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
