<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/finance-icon.svg" />
    <link rel="apple-touch-icon" href="/finance-icon-192.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Plan your monthly budget and visualise your cash flow."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Finance" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta id="theme-color-app" name="theme-color" content="#f3f5fb" />
    <script>
      ;(() => {
        const root = document.documentElement
        const media = window.matchMedia('(prefers-color-scheme: dark)')
        try {
          const stored =
            window.localStorage.getItem('finance-theme') ??
            window.localStorage.getItem('mon-budget-theme')
          const preference =
            stored === 'light' || stored === 'dark' || stored === 'system'
              ? stored
              : 'system'
          const theme =
            preference === 'system'
              ? media.matches
                ? 'dark'
                : 'light'
              : preference
          root.dataset.themePreference = preference
          root.dataset.theme = theme
          root.style.colorScheme = theme
          document
            .querySelector('#theme-color-app')
            .setAttribute(
              'content',
              theme === 'dark' ? '#0c0f19' : '#f3f5fb',
            )
        } catch (error) {
          const theme = media.matches ? 'dark' : 'light'
          root.dataset.themePreference = 'system'
          root.dataset.theme = theme
          root.style.colorScheme = theme
          document
            .querySelector('#theme-color-app')
            .setAttribute(
              'content',
              theme === 'dark' ? '#0c0f19' : '#f3f5fb',
            )
          console.warn('The local theme preference is unavailable.', error)
        }
      })()
    </script>
    <title>Finance</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
