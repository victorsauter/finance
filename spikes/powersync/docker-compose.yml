# Self-hosted PowerSync for the Finance spike. LOCAL ONLY.
#
# One container. Bucket storage is Postgres, in a separate database
# (`powersync_storage`) on the same local Supabase Postgres server, which the
# docs allow for Postgres 14+ (Supabase local runs 17). The source database is
# the local Supabase `postgres` database, reached over the Supabase Docker
# network. Both connection strings come from `.env`, written by
# `npm run setup-db` with random passwords; nothing secret is committed here.
name: finance-powersync-spike

services:
  powersync:
    image: journeyapps/powersync-service:1.28.3
    command: ["start", "-r", "unified"]
    restart: "no"
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      NODE_OPTIONS: --max-old-space-size=400
      PS_DATA_SOURCE_URI: ${PS_DATA_SOURCE_URI:?run npm run setup-db first}
      PS_STORAGE_SOURCE_URI: ${PS_STORAGE_SOURCE_URI:?run npm run setup-db first}
      PS_JWKS_URL: http://supabase_kong_finance:8000/auth/v1/.well-known/jwks.json
      PS_PORT: "8080"
    volumes:
      - ./powersync:/config:ro
    ports:
      - "127.0.0.1:${PS_HOST_PORT:-8080}:8080"
    mem_limit: 512m
    networks:
      - supabase
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/probes/liveness').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 2s
      retries: 30

networks:
  # Created by `supabase start` for project_id "finance" (supabase/config.toml).
  supabase:
    name: supabase_network_finance
    external: true
